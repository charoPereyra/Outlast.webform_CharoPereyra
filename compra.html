<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Outlast</title>

    <link rel="stylesheet" href="styles2.css">

</head>


<body class="compra-page">


    <main class="formulario-outlast">


        <div class="formulario-titulo">

            <img
                src="LogoOutlast.webp"
                alt="Outlast"
                class="formulario-logo"
            >

            <h1>
                REGISTRATE EN @OUTLAST.NET
            </h1>

            <p>
                Completa con tus datos para registrarte
            </p>

        </div>

        <form
            action="#"
            method="POST"
            id="registroForm"
        >



            <fieldset>

                <legend>DATOS PERSONALES</legend>


                <div class="campo">

                    <label for="nombre">
                        Nombre completo *
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Margarita Sanchez"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        Correo electrónico *
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ej: SanchezMargg7@gmail.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Ej: +54 11 7865-3469"
                    >

                </div>


                <div class="campo">

                    <label for="fechaNacimiento">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                    >

                </div>


                <div class="campo">

                    <label for="user">
                        Usuario *
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        placeholder="Ej: Margsan23"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña *
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmPassword">
                        Confirmar contraseña *
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        required
                    >

                </div>


            </fieldset>

            <fieldset>

                <legend>INFORMACIÓN ADICIONAL</legend>


                <div class="campo">

                    <label for="pais">
                        País *
                    </label>

                    <select
                        id="pais"
                        name="pais"
                        required
                    >

                        <option value="">
                            Selecciona un país...
                        </option>

                        <option value="AR">Argentina</option>
                        <option value="BO">Bolivia</option>
                        <option value="BR">Brasil</option>
                        <option value="CL">Chile</option>
                        <option value="CO">Colombia</option>
                        <option value="EC">Ecuador</option>
                        <option value="ES">España</option>
                        <option value="MX">México</option>
                        <option value="PE">Perú</option>
                        <option value="UY">Uruguay</option>
                        <option value="VE">Venezuela</option>
                        <option value="OTRO">Otro</option>

                    </select>

                </div>



                <div class="campo">

                    <label>
                        Género
                    </label>


                    <div class="opciones-genero">

                        <label>
                            <input
                                type="radio"
                                name="genero"
                                value="masculino"
                            >
                            Masculino
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="genero"
                                value="femenino"
                            >
                            Femenino
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="genero"
                                value="otro"
                            >
                            Otro
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="genero"
                                value="noDeclarar"
                                checked
                            >
                            Prefiero no decirlo
                        </label>

                    </div>

                </div>


            </fieldset>


            <div class="terminos">

                <label>

                    <input
                        type="checkbox"
                        name="terminos"
                        required
                    >

                    Acepto los
                    <a href="#">
                        términos y condiciones
                    </a>
                    *

                </label>

            </div>


            <div class="botones-formulario">


                <a
                    href="slide2.html"
                    class="boton-registrarse"
                >
                    REGISTRARSE
                </a>


                <button
                    type="reset"
                    class="boton-limpiar"
                >
                    LIMPIAR FORMULARIO
                </button>


            </div>


        </form>


    </main>


</body>

</html>
